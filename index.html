<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mass Mafia</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#EE2D3A; --red-deep:#B81623; --paper:#FFFFFF; --ink:#000000; --soft:#F3F3F3; --line:#E2E2E2; --mute:#666666; --good:#14915A;
  --display:'Syncopate','Arial Black',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#000000;--ink:#FFFFFF;--soft:#161616;--line:#2C2C2C;--mute:#A0A0A0;}}
:root[data-theme="dark"]{--paper:#000000;--ink:#FFFFFF;--soft:#161616;--line:#2C2C2C;--mute:#A0A0A0;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
img{max-width:100%}
.app{max-width:560px;margin:0 auto;padding:0 16px 120px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;margin:0 -16px;border-bottom:1px solid var(--line)}
.mark{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;line-height:1;display:flex;align-items:center;gap:8px}
.mark i{display:inline-block;width:14px;height:18px;background:var(--red);clip-path:polygon(0 0,100% 50%,0 100%)}
.sync{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mute)}
.sync.on::before{background:var(--good)}

/* banner */
.banner{background:var(--soft);border-left:4px solid var(--red);padding:10px 12px;margin:12px 0;font-size:14px}

/* hero */
.hero{position:relative;margin:16px 0 8px;min-height:150px}
.slab{position:relative;background:var(--red);color:#fff;padding:18px 70px 20px 18px;clip-path:polygon(0 0,100% 0,84% 100%,0 100%);}
.slab .wk{display:block;font-family:var(--display);font-size:40px;line-height:1;letter-spacing:.02em}
.slab .of{display:block;margin-top:8px;font-weight:600;font-size:15px}
.hero::after{content:"";position:absolute;right:0;top:0;width:34%;height:100%;background:var(--ink);clip-path:polygon(55% 0,100% 0,100% 100%,15% 100%);z-index:-1}
.scorebox{position:absolute;right:6px;bottom:10px;text-align:right;color:var(--paper)}
.scorebox b{display:block;font-family:var(--display);font-size:34px;line-height:1}
.scorebox span{font-size:12px}
.daytype{margin:10px 0 0;font-weight:700;font-stretch:115%;font-size:18px}

/* date nav */
.datenav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px}
.datenav button{border:1px solid var(--line);background:var(--paper);width:40px;height:40px;border-radius:50%;font-size:20px;line-height:1}
.datenav .lbl{text-align:center}
.datenav .lbl b{display:block;font-stretch:115%;font-size:18px}
.datenav .lbl small{color:var(--mute);font-size:13px}
.linkbtn{background:none;border:0;color:var(--red);font-weight:700;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

/* blocks */
.blk{border-top:3px solid var(--ink);padding:14px 0 18px;margin-top:14px}
.blk h2{margin:0 0 4px;font-size:20px;font-weight:800;font-stretch:118%;line-height:1.2;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.blk h2 small{font-size:14px;font-weight:600;font-stretch:100%;color:var(--mute)}
.sub{color:var(--mute);font-size:14px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}

/* calories */
.cal{display:flex;align-items:baseline;gap:8px;margin:6px 0 8px}
.cal b{font-family:var(--display);font-size:30px;line-height:1}
.cal span{color:var(--mute)}
.bar{height:12px;background:var(--soft);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--red);transition:width .3s}
.bar.done i{background:var(--good)}

/* checks */
.chk{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;text-align:left}
.chk:last-child{border-bottom:0}
.box{flex:none;width:26px;height:26px;border:2px solid var(--ink);display:grid;place-items:center}
.chk.on .box{background:var(--red);border-color:var(--red)}
.chk.on .box::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:translateY(-2px) rotate(-45deg)}
.chk b{display:block;font-weight:700}
.chk small{display:block;color:var(--mute);font-size:13px}
.counter{display:flex;align-items:center;gap:8px}
.counter button{width:36px;height:36px;border:2px solid var(--ink);background:var(--paper);font-size:20px;line-height:1;font-weight:700}
.counter output{min-width:44px;text-align:center;font-weight:800}

/* water */
.water{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:8px}
.water button{aspect-ratio:1/1.6;border:2px solid var(--ink);background:var(--paper);padding:0;position:relative}
.water button.on{background:var(--red);border-color:var(--red)}
.water button::before{content:"";position:absolute;left:30%;right:30%;top:-6px;height:5px;background:inherit;border:2px solid var(--ink);border-bottom:0}
.water button.on::before{border-color:var(--red)}

/* inputs */
label.fld{display:block;margin:10px 0}
label.fld span{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
input[type=text],input[type=number],input[type=date],textarea{width:100%;border:2px solid var(--line);background:var(--paper);padding:10px 12px;border-radius:0;font-size:16px}
input:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{min-height:76px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--paper);border:0;padding:13px 18px;font-weight:800;font-stretch:112%;font-size:15px}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:none;color:var(--ink);border:2px solid var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}

/* meals */
.meal{border-bottom:1px solid var(--line);padding:10px 0}
.meal:last-child{border-bottom:0}
.meal .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meal .hd b{font-weight:800}
.meal .hd small{color:var(--mute)}
.addb{border:2px solid var(--ink);background:var(--paper);font-weight:800;padding:4px 10px;font-size:14px}
.item{display:flex;align-items:center;gap:8px;font-size:15px;margin-top:6px}
.item .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .x{border:0;background:none;color:var(--mute);font-size:20px;line-height:1;padding:0 4px}

/* recipes */
.rec{border-bottom:1px solid var(--line)}
.rec>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;padding:12px 0;text-align:left}
.rec>button b{font-weight:800}
.rec>button small{color:var(--mute)}
.recbody{padding:0 0 14px;font-size:15px}
.recbody ul{margin:6px 0 10px;padding-left:20px}
.recbody p{margin:6px 0}
.tag{display:inline-block;font-size:12px;font-weight:700;border:1px solid var(--line);padding:1px 6px;margin-left:6px;color:var(--mute)}

/* train */
.weeks{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;margin:12px -16px 0;padding-left:16px;padding-right:16px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.weeks button{flex:none;width:46px;height:52px;border:2px solid var(--line);background:var(--paper);font-weight:800;line-height:1.1;font-size:15px}
.weeks button small{display:block;font-size:10px;font-weight:600;color:var(--mute)}
.weeks button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.weeks button.on small{color:var(--paper)}
.weeks button.now{border-color:var(--red)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);margin-top:6px}
.seg button{border:0;background:var(--paper);padding:10px 4px;font-weight:800;line-height:1.15}
.seg button small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--red);color:#fff}
.seg button.on small{color:#fff}
.ex{border-top:1px solid var(--line);padding:14px 0}
.ex:first-of-type{border-top:0}
.ex .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex .nm b{font-size:18px;font-weight:800;font-stretch:112%}
.ex .nm span{font-weight:800;color:var(--red)}
.hint{font-size:13px;color:var(--mute);margin:4px 0 6px}
.set{display:grid;grid-template-columns:54px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:8px}
.set .sn{font-size:13px;font-weight:700;line-height:1.15}
.set .sn small{display:block;color:var(--mute);font-weight:500}
.set input{padding:8px 10px;text-align:center}
.set .ok{height:42px;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center}
.set .ok.on{background:var(--red);border-color:var(--red)}
.set .ok.on::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:translateY(-2px) rotate(-45deg)}
.set .ok:not(.on)::after{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.colhd{display:grid;grid-template-columns:54px 1fr 1fr 44px;gap:8px;font-size:12px;color:var(--mute);margin-top:8px;text-align:center}
.colhd span:first-child{text-align:left}
.rounds{display:flex;gap:8px;margin-top:8px}
.rounds button{flex:1;border:2px solid var(--ink);background:var(--paper);padding:10px 4px;font-weight:800}
.rounds button.on{background:var(--red);border-color:var(--red);color:#fff}
.moves{font-size:14px;color:var(--mute)}
.donebar{margin-top:16px}
.stretch dl{margin:8px 0 0}
.stretch dt{font-weight:800;margin-top:10px}
.stretch dd{margin:2px 0 0;font-size:14px;color:var(--mute)}

/* crew */
.lead{border-bottom:1px solid var(--line)}
.lead>button{width:100%;background:none;border:0;padding:12px 0;text-align:left;display:grid;grid-template-columns:28px 40px 1fr;gap:10px;align-items:center}
.rank{font-family:var(--display);font-size:18px}
.av{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:800;font-size:15px}
.av.me{background:var(--red);color:#fff}
.lead .who b{display:block;font-weight:800}
.lead .who small{display:block;color:var(--mute);font-size:13px}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.dot{height:20px;background:var(--soft);position:relative;font-size:10px;font-weight:700;display:grid;place-items:center;color:var(--mute)}
.dot.s1{background:#F9C9CC;color:#7A0D16}.dot.s2{background:#F27C84;color:#fff}.dot.s3{background:var(--red);color:#fff}
.dot.wo::after{content:"";position:absolute;left:50%;top:-4px;width:6px;height:6px;background:var(--ink);transform:translateX(-50%) rotate(45deg)}
.leaddetail{padding:0 0 14px 78px;font-size:14px}
.leaddetail table{width:100%;border-collapse:collapse}
.leaddetail td,.leaddetail th{padding:4px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.leaddetail th{font-weight:700;color:var(--mute);font-size:12px}
.leaddetail td:first-child,.leaddetail th:first-child{text-align:left}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;font-size:12px;color:var(--mute)}
.stats b{display:block;font-size:16px;color:var(--ink);font-weight:800}
.wallform{display:flex;gap:8px;margin:10px 0}
.wallform input{flex:1}
.post{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:32px 1fr;gap:10px}
.post .av{width:32px;height:32px;font-size:12px}
.post b{font-weight:800}
.post small{color:var(--mute);margin-left:6px}
.post p{margin:2px 0 0;overflow-wrap:anywhere}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute);margin-top:6px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:12px;height:12px}

/* me */
.tblwrap{overflow-x:auto;margin:10px -16px 0;padding:0 16px}
table.meas{border-collapse:collapse;min-width:520px;width:100%;font-size:14px}
table.meas th{font-size:12px;text-align:center;padding:6px 4px;background:var(--red);color:#fff;font-weight:700}
table.meas th:first-child{background:var(--ink);text-align:left}
table.meas td{border:1px solid var(--line);padding:0}
table.meas td:first-child{padding:6px 8px;font-weight:700;background:var(--soft);white-space:nowrap}
table.meas input{border:0;width:100%;min-width:56px;text-align:center;padding:8px 4px;background:transparent}
table.meas td.diff{text-align:center;font-weight:800;padding:6px 4px}
.abrule{font-size:14px}
.abrule div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}

/* history + progress */
.last{font-size:13px;color:var(--mute);margin:2px 0 4px}
.last b{color:var(--ink)}
.lastlist{margin:6px 0 0;font-size:13px;color:var(--mute)}
.lastlist div{padding:2px 0}
.lastlist b{color:var(--ink);font-weight:700}
.ci{border:2px solid var(--line);margin-top:10px}
.ci.open{border-color:var(--ink)}
.ci.due{border-color:var(--red)}
.cihd{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:12px;text-align:left}
.cihd b{display:block;font-weight:800;font-stretch:112%;font-size:17px}
.cihd small{color:var(--mute);font-size:13px}
.cist{font-size:13px;font-weight:700;text-align:right}
.cist.done{color:var(--good)}
.cibody{padding:0 12px 14px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.tile{position:relative;aspect-ratio:3/4;background:var(--soft);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700;color:var(--mute);overflow:hidden;cursor:pointer;padding:4px}
.tile.has{border-style:solid;border-color:var(--ink)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:3px 4px}
.tile input{position:absolute;opacity:0;width:1px;height:1px}
.tile.busy::after{content:"Uploading";position:absolute;inset:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.tile:focus-within{outline:3px solid var(--red);outline-offset:2px}
.rmph{display:block;margin-top:2px;font-size:12px;background:none;border:0;color:var(--mute);text-decoration:underline;padding:2px 0}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:8px}
.mgrid label span{display:block;font-size:12px;font-weight:700;margin-bottom:2px}
.mgrid input{padding:8px 10px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0;scrollbar-width:none}
.chips button{flex:none;border:2px solid var(--line);background:var(--paper);padding:6px 10px;font-weight:700;font-size:13px}
.chips button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--soft)}
.cmp figcaption{font-size:13px;font-weight:700;margin-top:4px}
.lp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lp b{font-weight:800}
.lp .chg{font-weight:800;text-align:right}
.lp .chg.up{color:var(--good)}
.lp small{color:var(--mute);font-size:13px}
.spark{width:96px;height:30px;stroke:var(--red);fill:none;stroke-width:2.5}
.wchart{width:100%;height:120px;margin-top:8px}
.wchart polyline{stroke:var(--red);fill:none;stroke-width:2.5}
.wchart circle{fill:var(--red)}
.wchart line{stroke:var(--line)}
.bigstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.bigstats div{font-size:12px;color:var(--mute)}
.bigstats b{display:block;font-family:var(--display);font-size:20px;color:var(--ink)}
table.meas.ro td{padding:6px 4px;text-align:center}
table.meas.ro td:first-child{text-align:left}
.cwo{margin-top:12px;border-top:2px solid var(--ink);padding-top:8px}
.cwo .chips button[disabled]{opacity:.35}
.cwo .exr{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.cwo .exr b{font-weight:800}
.cwo .exr span{text-align:right;font-weight:600}
.cwo .pr{color:var(--good);font-size:12px;font-weight:800;margin-left:4px}
.thumbs{display:flex;gap:4px;margin-top:6px;overflow-x:auto}
.thumbs img{width:56px;height:74px;object-fit:cover;flex:none}

/* today workout list */
.wol{margin-top:6px}
.wol button{width:100%;display:grid;grid-template-columns:1fr auto 18px;gap:10px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0;text-align:left}
.wol button:last-child{border-bottom:0}
.wol b{display:block;font-weight:800}
.wol small{display:block;color:var(--mute);font-size:13px}
.wol .pg{font-weight:800;font-size:14px;text-align:right;white-space:nowrap}
.wol .pg.done{color:var(--good)}
.wol .ar{color:var(--red);font-size:22px;line-height:1;font-weight:800}
.wohd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit}
.ex{scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}

/* my meals */
.secl{font-size:13px;font-weight:800;margin:12px 0 4px}
.secl small{font-weight:600;color:var(--mute)}
.pickgrid button em{display:block;font-style:normal;font-size:11px;color:var(--mute);margin-top:2px}
.savechk{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px}
.savechk input{width:20px;height:20px;accent-color:var(--red)}
.recact{display:flex;gap:8px;margin-top:8px}
.recact .btn{padding:8px 14px;font-size:14px}
.prot{font-size:14px;color:var(--mute);margin-top:6px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--mute)}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
.tabs button.on{color:var(--red)}

[hidden]{display:none!important}
/* timer */
.timer{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:31;background:var(--ink);color:var(--paper)}
.timer .tbar{height:6px;background:rgba(255,255,255,.18)}
.timer .tbar i{display:block;height:100%;background:var(--red);transition:width .2s linear}
.timer.plank .tbar i{background:#fff}
.tin{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px}
.tin .tl{display:block;font-size:12px;font-weight:700;opacity:.8}
.tin b{font-family:var(--display);font-size:30px;line-height:1}
.tbtns{display:flex;gap:6px}
.tbtns button{background:transparent;color:var(--paper);border:2px solid var(--paper);padding:8px 10px;font-weight:800;font-size:14px;min-width:44px}
.tbtns button.red{background:var(--red);border-color:var(--red);color:#fff}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:85%;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--red)}
.sheet h3{margin:0;font-size:20px;font-weight:800;font-stretch:118%;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{border:0;background:none;font-size:26px;line-height:1}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.pickgrid button{border:2px solid var(--line);background:var(--paper);padding:10px;text-align:left;line-height:1.25}
.pickgrid button b{display:block;font-weight:800;font-size:14px}
.pickgrid button small{color:var(--red);font-weight:800}
.pickgrid button:active{border-color:var(--red)}
.custom{display:grid;grid-template-columns:1fr 92px;gap:8px}

/* onboarding */
.join{padding:24px 0}
.join .slab{margin:0 0 18px}
.join h1{font-family:var(--display);font-size:32px;line-height:1.05;margin:0}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;z-index:50;font-weight:700;font-size:14px;max-width:90%}
.empty{color:var(--mute);font-size:15px;padding:8px 0}
.winb{display:inline-block;background:var(--good);color:#fff;font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:.08em;padding:2px 8px;vertical-align:middle}
.dot.cur{outline:2px solid var(--ink);outline-offset:1px}

.loading{padding:40px 0;text-align:center;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const Backend={kind:'none',crew:false};
function LocalDB(){
  let docs={};try{docs=JSON.parse(localStorage.getItem(LS_KEY)||'{}').docs||{};}catch(e){docs={};}
  const subs=[];
  const persist=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify({v:3,docs}));}catch(e){toast('Could not save. Phone storage may be full.');throw e;}};
  const notify=()=>subs.slice().forEach(f=>{try{f();}catch(e){console.warn(e);}});
  const snapDoc=p=>({exists:p in docs,id:p.split('/').pop(),data:()=>clone(docs[p])});
  const doc=p=>({
    get:async()=>snapDoc(p),
    set:async o=>{docs[p]=clone(o);persist();notify();},
    update:async o=>{docs[p]=deepMerge(docs[p]||{},clone(o));persist();notify();},
    onSnapshot:cb=>{const f=()=>cb(snapDoc(p));subs.push(f);setTimeout(f,0);return ()=>{};}
  });
  const coll=(name,opt)=>{opt=opt||{};const depth=name.split('/').length+1;return {
    orderBy:(f,dir)=>coll(name,Object.assign({},opt,{f,dir})),
    limit:n=>coll(name,Object.assign({},opt,{n})),
    add:async o=>{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);await doc(name+'/'+id).set(o);return {id};},
    onSnapshot:cb=>{const f=()=>{let ds=Object.keys(docs).filter(k=>k.startsWith(name+'/')&&k.split('/').length===depth).map(k=>({id:k.slice(name.length+1),data:()=>clone(docs[k])}));
      if(opt.f)ds.sort((a,b)=>{const x=a.data()[opt.f],y=b.data()[opt.f];return (x<y?-1:x>y?1:0)*(opt.dir==='desc'?-1:1);});
      if(opt.n)ds=ds.slice(0,opt.n);cb({docs:ds,metadata:{fromCache:false}});};subs.push(f);setTimeout(f,0);return ()=>{};}
  };};
  return {doc,collection:coll,_docs:()=>docs,_replace:d=>{docs=d||{};persist();}};
}
function LocalAssets(){
  const open=()=>new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no storage'));const r=indexedDB.open('mm_photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
  const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('p',mode);const rq=fn(t.objectStore('p'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);}));
  return {
    upload:async blob=>{const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await run('readwrite',s=>s.put(blob,id));return {id};},
    get:id=>run('readonly',s=>s.get(id)),
    delete:id=>run('readwrite',s=>s.delete(id))};
}

function newMe(){return {name:'Me',start:'2026-10-26',bw:null,goal:5000,program:'45',liftDays:[1,3,5],rest:60,envision:'',because:'',days:{},weights:{},meas:{},lifts:{},tests:{},myMeals:[],joined:Date.now()};}
function importOld(o){
  const prof=o.prof||{},curls=(Array.isArray(prof.curls)&&prof.curls.length===3)?prof.curls:BI_DEFAULT;
  const me=newMe();me.rest=[60,90,120].includes(prof.autoRest)?prof.autoRest:60;me.bi=curls.slice();
  (o.meas||[]).forEach(m=>{if(num(m.bw))me.weights[m.date]=num(m.bw);});
  const ws=Object.keys(me.weights).sort();if(ws.length)me.bw=me.weights[ws[ws.length-1]];
  Object.entries(o.checkins||{}).forEach(([k,c])=>{const m={};Object.entries((c&&c.m)||{}).forEach(([a,b])=>{if(b!==''&&b!=null)m[a]=num(b);});me.meas[k]=m;});
  const tk={'Vertical jump':'vj','Broad jump':'bj','5-10-5 pro agility':'pro','40 yard dash':'f40','100 yard dash':'d100'};
  Object.entries(prof.goals||{}).forEach(([k,v])=>{if(v!==''&&v!=null){me.tests[k]=me.tests[k]||{};me.tests[k].goal=num(v);}});
  (o.myMeals||[]).forEach((m,i)=>{if(m&&m.name)me.myMeals.push({id:'m'+i+Date.now().toString(36),name:m.name,cal:num(m.cal),p:null,serve:'',ing:[],steps:''});});
  const keyOf=ex=>{if(ex==='Squat'||ex==='Deadlift')return 'lower';if(ex==='Hip thrust')return 'hip';if(ex==='Bench press')return 'bench';if(ex==='Pull-ups')return 'pull';if(ex==='Dips')return 'dips';if(Object.values(PRESS_BY_PHASE).includes(ex))return 'mil';const bi=curls.indexOf(ex);if(bi>=0)return 'bi'+bi;for(const p of 'ABC'){const ai=AB_BY_PHASE[p].indexOf(ex);if(ai>=0)return 'ab'+ai;}return null;};
  const days={};
  Object.entries(o.days||{}).forEach(([d,v])=>{
    if(!v||typeof v!=='object')return;
    const meals={};MEALS.forEach(([k])=>{meals[k]=((v.food||{})[k]||[]).map(x=>({f:x.name,c:num(x.cal)}));});
    const supps={};Object.entries(v.bonus||{}).forEach(([k,b])=>{if(k.indexOf('s_')===0&&b)supps[k.slice(2)]=true;});
    const sets={};
    Object.entries(v.sets||{}).forEach(([ex,arr])=>{const k=keyOf(ex);if(!k||!Array.isArray(arr))return;sets[k]=arr.map(x=>x?{w:x.w??'',r:x.r??'',ok:!!x.done}:{});
      const hist=arr.map(x=>x&&x.done&&(num(x.w)||num(x.r))?{w:num(x.w),r:num(x.r)}:null);while(hist.length&&!hist[hist.length-1])hist.pop();
      if(hist.length){me.lifts[ex]=me.lifts[ex]||{};me.lifts[ex][d]=hist;}});
    const lift=v.type?['sq','dl'].includes(v.type):[1,3,5].includes(parse(d).getDay());
    const full=v.status==='Full';
    Object.entries(v.tests||{}).forEach(([lab,val])=>{const k=tk[lab];if(!k||val===''||val==null)return;const w=Math.floor(diffDays(mondayOf(me.start),d)/7)+1;const cp=w===1?'t1':w===6?'t6':w===12?'t12':null;if(cp){me.tests[k]=me.tests[k]||{};me.tests[k][cp]=num(val);}});
    days[d]={date:d,meals,supps,dig:0,water:(v.bonus||{}).water||0,sleep:v.sleep??'',stretch:false,readAM:false,readPM:false,weight:me.weights[d]??'',fl:v.fl||{},
      snack:!!v.snackDone,minDone:v.status==='Minimum',minOn:false,minItems:{},pm4:{},notes:[v.notes,v.dnotes].filter(Boolean).join(' '),
      wo:{sets,ss:{bi:[false,false,false],ab:[false,false,false]},done:full&&lift,chk:{}},cond:{items:{},done:full&&!lift}};
  });
  const keep=S.me;S.me=me;Object.keys(days).forEach(d=>{me.days[d]=summarize(normDay(days[d],d),d);});S.me=keep;
  return {me,days};
}
function migrateLocal(db){
  const docs=db._docs();if(docs['members/me'])return;
  let raw=null,from='';
  try{raw=localStorage.getItem('mm45_v2');from='mm45_v2';if(!raw){raw=localStorage.getItem('mm45_v1');from='mm45_v1';}}catch(e){}
  let me=newMe();
  if(raw){try{const o=JSON.parse(raw);if(o&&typeof o.days==='object'){const out=importOld(o);me=out.me;me.migratedFrom=from;Object.entries(out.days).forEach(([d,v])=>{docs['logs/me/days/'+d]=v;});}}catch(e){console.warn(e);}}
  docs['members/me']=me;db._replace(docs);
}

function allDays(){if(Backend.kind==='local'){const pre='logs/'+S.uid+'/days/',docs=S.db._docs(),o={};Object.keys(docs).filter(k=>k.indexOf(pre)===0).forEach(k=>{const d=k.slice(pre.length);o[d]=S.days[d]||normDay(docs[k],d);});return o;}return S.days;}
const csvOf=rows=>rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',')).join('\n');
function csvSets(){const rows=[];const L=S.me.lifts||{};Object.keys(L).forEach(n=>Object.entries(L[n]||{}).forEach(([d,a])=>{if(Array.isArray(a))a.forEach((x,i)=>{if(x)rows.push([d,n,i+1,x.w||'',x.r||'']);});}));rows.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);return csvOf([['Date','Exercise','Set or round','Weight (lbs)','Reps'],...rows]);}
function csvFloors(){const D=allDays();const rows=Object.keys(D).filter(d=>d>=FLOOR_START).sort().map(d=>{const x=D[d],f=floorsOf(d),o=workedOf(d);return [d,DAYN[parse(d).getDay()],f.win?'yes':'no',f.n,f.tot,...FLOOR_KEYS.map(k=>x.fl[k]?'yes':''),x.sleep,o.wk?(x.minDone&&!x.wo.done&&!x.cond.done?'minimum':'yes'):'',o.gym?'yes':'',x.snack?'yes':'',x.water||'',calOf(x)||'',x.notes||''];});
  return csvOf([['Date','Day','WIN','Floors hit','Of',...FLOOR_KEYS.map(k=>FLOOR_NAME[k]),'Sleep hours','Workout','Gym','Tendon snack','Water','Calories','Notes'],...rows]);}
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

function importFile(el){
  const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);let docs=null;

function normDay(d,date){
  d=d||{};
  const meals={};MEALS.forEach(([k])=>{meals[k]=Array.isArray(d.meals&&d.meals[k])?d.meals[k]:[];});
  return {date,meals,dig:d.dig||0,supps:d.supps||{},water:d.water||0,sleep:d.sleep??'',stretch:!!d.stretch,readAM:!!d.readAM,readPM:!!d.readPM,weight:d.weight??'',
    wo:{sets:(d.wo&&d.wo.sets)||{},ss:(d.wo&&d.wo.ss)||{bi:[false,false,false],ab:[false,false,false]},done:!!(d.wo&&d.wo.done),chk:(d.wo&&d.wo.chk)||{}},cond:{items:(d.cond&&d.cond.items)||{},done:!!(d.cond&&d.cond.done)},snack:!!d.snack,
    fl:d.fl||{},minOn:!!d.minOn,minDone:!!d.minDone,minItems:d.minItems||{},pm4:d.pm4||{},notes:d.notes||''};
}
const calOf=day=>MEALS.reduce((a,[k])=>a+day.meals[k].reduce((b,i)=>b+num(i.c),0),0);
const mealsEaten=day=>MEALS.filter(([k])=>day.meals[k].length).length;
function suppPct(day,date){
  const list=isTrain(date)?SUPP_TRAIN:SUPP_OFF;
  const target=Math.max(5,mealsEaten(day));
  const got=list.filter(s=>day.supps[s.k]).length+Math.min(day.dig/target,1);
  return got/(list.length+1);
}
function scoreOf(day,date){
  const parts=[Math.min(calOf(day)/goal(),1),suppPct(day,date),Math.min(day.water/8,1),Math.min(num(day.sleep)/7,1),day.stretch?1:0,(day.readAM+day.readPM)/2];
  if(isTrain(date))parts.push(day.wo.done?1:0);
  else if(condOf(date))parts.push(day.cond.done?1:0);
  { const w=progWeek(date); if(w>=1&&w<=12) parts.push(day.snack?1:0); }
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100);
}
function summarize(day,date){
  return {cal:calOf(day),sp:Math.round(suppPct(day,date)*100),w:day.water,sl:num(day.sleep),st:day.stretch,wo:isTrain(date)?day.wo.done:null,cd:condOf(date)?day.cond.done:null,sc:scoreOf(day,date),
    fln:flN(day.fl),slg:day.sleep!==''&&day.sleep!=null,wk:!!(day.wo.done||day.cond.done||day.minDone),gym:!!(day.wo.done&&isTrain(date)&&inProg(date)),sn:!!day.snack};
}

/* ---------- persistence ---------- */
let chain=Promise.resolve();
function queue(fn){
  if(S.local||S.readOnly)return;
  chain=chain.then(fn).catch(err=>{
    console.warn(err);
    if(err&&err.code==='invalid_argument'){S.readOnly=true;showBanner();}
    else if(err&&err.code==='quota_exceeded')toast('The crew database is full. Ask the owner to clear old entries.');
    else toast('Could not save. Check your connection.');
  });
}
async function ensureDay(date){
  if(S.days[date])return S.days[date];
  if(!S.loadingDays[date])S.loadingDays[date]=(async()=>{
    let d=null;
    if(S.db&&!S.local){try{const snap=await S.db.doc(`logs/${S.uid}/days/${date}`).get();if(snap.exists)d=clone(snap.data());}catch(e){console.warn(e);}}
    S.days[date]=normDay(d,date);return S.days[date];
  })();
  return S.loadingDays[date];
}
const saveTimers={};
function dirty(date){if(S.me&&S.days[date]){S.me.days=S.me.days||{};S.me.days[date]=summarize(S.days[date],date);}clearTimeout(saveTimers[date]);saveTimers[date]=setTimeout(()=>flush(date),600);refreshBits(date);}
function exNames(date){
  const w=progWeek(date);if(!isTrain(date)||!inProg(date))return [];
  const p=phaseOf(w);const list=is45()?[...plan45(w,liftOf(date)),...CIRC(p)].map(e=>({key:e.k,name:e.n})):plan(w,liftOf(date)).map(e=>({key:e.k,name:e.n}));
  bicepMoves().forEach((n,m)=>list.push({key:'bi'+m,name:n}));
  AB_BY_PHASE[p].forEach((n,m)=>list.push({key:'ab'+m,name:n}));
  return list;
}
function liftPatch(day,date){
  const out={};
  exNames(date).forEach(({key,name})=>{
    const sets=(day.wo.sets[key]||[]).map(x=>x&&(num(x.w)||num(x.r))?{w:num(x.w),r:num(x.r)}:null);
    while(sets.length&&!sets[sets.length-1])sets.pop();
    out[name]={[date]:sets.length?sets:null};
  });
  return out;
}
function lastFor(name,date){
  const h=((S.me&&S.me.lifts)||{})[name]||{};
  const keys=Object.keys(h).filter(d=>d<date&&Array.isArray(h[d])&&h[d].some(Boolean)).sort();
  return keys.length?{date:keys[keys.length-1],sets:h[keys[keys.length-1]]}:null;
}
const setTxt=x=>!x?'':x.w?`${fmt(x.w)}x${x.r||0}`:`${x.r}`;
function lastLine(name,date){
  const l=lastFor(name,date);
  return l?`<p class="last">Last time (${esc(fmtShort(l.date))}): <b>${l.sets.filter(Boolean).map(setTxt).join(', ')}</b></p>`:`<p class="last">First time logging this one.</p>`;
}
function flush(date){
  const day=S.days[date];if(!day||!S.me)return;
  const sum=summarize(day,date);
  const w=num(day.weight)||null;
  const lifts=liftPatch(day,date);
  S.me.days=S.me.days||{};S.me.days[date]=sum;
  S.me.weights=S.me.weights||{};S.me.weights[date]=w;
  S.me.lifts=deepMerge(S.me.lifts||{},clone(lifts));
  queue(()=>S.db.doc(`logs/${S.uid}/days/${date}`).set(clone(day)));
  const patch={days:{[date]:sum},weights:{[date]:w}};if(Object.keys(lifts).length)patch.lifts=lifts;
  queue(()=>S.db.doc('members/'+S.uid).update(patch));
}
function saveMe(patch){deepMerge(S.me,patch);queue(()=>S.db.doc('members/'+S.uid).update(clone(patch)));}

(async function boot(){
  const C=window.claude;
  if(C&&C.use){
    try{S.db=await C.use('db');S.user=await C.use('user');}catch(e){}
    if(S.user){try{S.uid=await S.user.id();const me=await S.user.me();S.profileName=me.name||'';const cw=await S.user.can('data.write');if(cw===false)S.readOnly=true;}catch(e){}}
  }

    S.db=null;S.readOnly=false;let ok=false;

    S.wall=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(S.tab==='crew')softRender();

})();

  render();

/* ---------- render ---------- */
function render(){
  const main=$('#main');
  if(!S.loaded){main.innerHTML='<div class="loading">Loading your program</div>';return;}
  if(!S.me){$('#tabs').hidden=true;main.innerHTML=viewJoin();return;}
  $('#tabs').hidden=false;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.act==='tab:'+S.tab));
  const v={today:viewToday,train:viewTrain,fuel:viewFuel,crew:viewCrew,prog:viewProgress}[S.tab];
  const out=v();
  if(out instanceof Promise){main.innerHTML='<div class="loading">Loading</div>';out.then(h=>{main.innerHTML=h;});}
  else main.innerHTML=out;
}
function needDay(date,fn){
  if(S.days[date])return fn(S.days[date]);
  return ensureDay(date).then(fn);
}
function refreshBits(date){
  const day=S.days[date];if(!day)return;
  const sc=$('#scoreNum');if(sc&&date===S.date)sc.textContent=is45()?floorsTxt(date):scoreOf(day,date);
  const cn=document.querySelectorAll('[data-calnow]');cn.forEach(el=>el.textContent=fmt(calOf(day)));
}

function dateNav(){

function nextTrainDate(date){for(let i=1;i<=7;i++){const d=addDays(date,i);const w=progWeek(d);if(isTrain(d)&&(is45()?inProg(d):w>=1&&w<=12))return d;}return null;}
function woItems(date,day){
  if(is45())return woItems45(date,day);
  const w=progWeek(date),p=phaseOf(w),sets=k=>((day&&day.wo.sets[k])||[]).filter(x=>x&&x.ok).length;
  const items=plan(w,liftOf(date)).map(e=>{const l=lastFor(e.n,date);const top=l&&topSet(l.sets);
    return {key:e.k,name:e.n,sub:repLabel(e.reps)+(top?`, last ${setTxt(top)}`:''),done:sets(e.k),total:e.reps.length};});
  const bm=bicepMoves(),am=AB_BY_PHASE[p];
  items.push({key:'bi',name:'Bicep super-set',sub:bm.join(', '),done:[0,1,2].reduce((a,m)=>a+sets('bi'+m),0),total:bm.length*3});
  items.push({key:'ab',name:'Abs super-set',sub:am.join(', ')+', plank',done:[0,1,2].reduce((a,m)=>a+sets('ab'+m),0)+sets('plank'),total:12});
  return items;
}

/* Train */
function trainDefaults(){
  if(is45()){
    if(S.trainWeek!=null)return;
    const t=today();let w=progWeek(t),dw=parse(t).getDay();
    if(w<1){S.trainWeek=dw===0||dw===6?1:0;S.trainDay=dw===0||dw===6?0:(dw===4||dw===5?2:1);if(w<0){S.trainWeek=1;S.trainDay=0;}return;}
    if(w>12)w=12;
    const L=liftDays(),mo=monOff(dw);let di=L.findIndex(d=>monOff(d)>=mo);
    if(di<0){di=0;if(w<12)w=w+1;}
    S.trainWeek=w;S.trainDay=di;return;
  }
  if(S.trainWeek)return;
  const t=today();let w=progWeek(t);
  if(w<1)w=1;if(w>12)w=12;
  const L=liftDays(),mo=monOff(parse(t).getDay());
  let di=L.findIndex(d=>monOff(d)>=mo);
  if(di<0){di=0;if(progWeek(t)>=1&&w<12)w=w+1;}
  S.trainWeek=w;S.trainDay=di;
}

function memberWeek(m,mon){
  const t=today();const days=m.days||{};
  const dates=Array.from({length:7},(_,i)=>addDays(mon,i));
  const counted=dates.filter(d=>d<=t);
  const scores=counted.map(d=>(days[d]&&days[d].sc)||0);
  const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;
  const logged=counted.filter(d=>days[d]&&days[d].cal);
  const avgCal=logged.length?logged.reduce((a,d)=>a+days[d].cal,0)/logged.length:0;
  const wos=dates.filter(d=>days[d]&&days[d].wo).length;
  const g=num(m.goal)||5000;
  let streak=0,d=t;if(!(days[d]&&days[d].cal>=g*.9))d=addDays(d,-1);
  while(days[d]&&days[d].cal>=g*.9&&streak<400){streak++;d=addDays(d,-1);}
  const ws=Object.entries(m.weights||{}).filter(([,v])=>v).sort((a,b)=>a[0]<b[0]?-1:1);
  const startW=num(m.meas&&m.meas.w0&&m.meas.w0.wt)||(ws[0]?ws[0][1]:0);
  const lastW=ws.length?ws[ws.length-1][1]:0;
  const gain=startW&&lastW?lastW-startW:null;
  return {dates,avg,avgCal,wos,streak,gain};
}

function crewWorkout(id,m,dates){
  const lifts=m.lifts||{};const byDate={};
  Object.entries(lifts).forEach(([n,h])=>Object.entries(h||{}).forEach(([d,v])=>{if(Array.isArray(v)&&v.some(Boolean))(byDate[d]=byDate[d]||[]).push(n);}));

  const withData=train.filter(d=>byDate[d]);
  let sel=S.crewDay&&S.crewDay[id];
  if(!sel||!train.includes(sel))sel=withData.length?withData[withData.length-1]:train.find(d=>d<=today())||train[0];
  const order=liftOrder();
  const names=(byDate[sel]||[]).sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
  const rows=names.map(n=>{
    const sets=lifts[n][sel];const top=topSet(sets);
    const prev=Object.keys(lifts[n]).filter(d=>d<sel&&Array.isArray(lifts[n][d])&&lifts[n][d].some(Boolean));
    const best=prev.map(d=>topSet(lifts[n][d])).reduce((a,b)=>!a||(b.w>a.w||(b.w===a.w&&b.r>a.r))?b:a,null);
    const pr=prev.length&&top&&best&&(top.w>best.w||(top.w===best.w&&top.r>best.r));

/* photos */
function shrink(file){
  const draw=src=>{const max=1600;const w0=src.width||src.naturalWidth,h0=src.height||src.naturalHeight;const sc=Math.min(1,max/Math.max(w0,h0));
    const cv=document.createElement('canvas');cv.width=Math.round(w0*sc);cv.height=Math.round(h0*sc);cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height);
    return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',0.85));};
  if(window.createImageBitmap)return createImageBitmap(file,{imageOrientation:'from-image'}).then(draw).catch(()=>viaReader());
  return viaReader();
  function viaReader(){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>draw(img).then(res,rej);img.onerror=()=>rej(new Error('decode'));img.src=fr.result;};fr.onerror=()=>rej(new Error('read'));fr.readAsDataURL(file);});}
}
function poseMap(k){const o={};POSES.forEach(([p])=>{o[p]=(S.photos[k]||{})[p]||null;});return o;}
function savePhotos(k){
  const body=clone(S.photos);
  queue(()=>S.db.doc('data/users/'+S.uid+'/checkins').set(body));
  if(S.me.share&&S.me.share[k])saveMe({sharedPhotos:{[k]:poseMap(k)}});
}
async function uploadPhoto(input){
  const [k,pk]=input.dataset.photo.split(':');const file=input.files&&input.files[0];if(!file)return;
  if(!S.assets){toast('Photo uploads need edit access.');return;}
  S.uploading=k+':'+pk;render();
  try{
    const blob=await shrink(file);
    const res=await S.assets.upload(blob,{type:'image/jpeg'});
    const old=(S.photos[k]||{})[pk];
    S.photos[k]=Object.assign({},S.photos[k],{[pk]:res.id});
    savePhotos(k);
    if(old)S.assets.delete(old).catch(()=>{});
    toast('Photo saved');
  }catch(err){console.warn(err);toast(err&&err.code==='quota_exceeded'?'Photo storage is full.':'Upload failed. Try again or use a different photo.');}
  S.uploading=null;render();
}

const T={label:'Rest',dur:60,end:0,left:0,paused:false,on:false,next:null,iv:null};
let actx=null;
function beep(){try{if(!actx)return;[0,0.25,0.5].forEach(o=>{const g=actx.createGain(),osc=actx.createOscillator();osc.frequency.value=880;g.gain.setValueAtTime(0.0001,actx.currentTime+o);g.gain.exponentialRampToValueAtTime(0.3,actx.currentTime+o+0.02);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+o+0.18);osc.connect(g).connect(actx.destination);osc.start(actx.currentTime+o);osc.stop(actx.currentTime+o+0.2);});}catch(e){}}
function startTimer(label,sec,next){
  try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC();}if(actx&&actx.state==='suspended')actx.resume();}catch(e){}
  T.label=label;T.dur=sec;T.end=Date.now()+sec*1000;T.left=sec;T.paused=false;T.on=true;T.next=next||null;
  clearInterval(T.iv);T.iv=setInterval(tick,200);tick();
}
function remaining(){return T.paused?T.left:Math.max(0,(T.end-Date.now())/1000);}
function tick(){
  if(!T.on)return;
  const left=remaining();
  if(left<=0){endTimer(false);return;}
  const el=$('#timer');el.hidden=false;el.classList.toggle('plank',T.label==='Plank');
  const sec=Math.ceil(left);
  el.querySelector('.tl').textContent=(T.label==='Plank'?'Plank, hold it':T.label)+(T.paused?' (paused)':'');
  el.querySelector('b').textContent=`${Math.floor(sec/60)}:${pad(sec%60)}`;
  el.querySelector('.tbar i').style.width=Math.min(100,left/T.dur*100)+'%';
  el.querySelector('.tp').textContent=T.paused?'Go':'Pause';
}
function endTimer(manual){
  clearInterval(T.iv);T.on=false;
  if(!manual){beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);}
  const n=T.next;T.next=null;
  if(n){n();return;}
  $('#timer').hidden=true;
  if(!manual)toast(T.label==='Plank'?'Plank done':'Rest is up. Next set.');
}
function pauseTimer(){if(!T.on)return;if(T.paused){T.end=Date.now()+T.left*1000;T.paused=false;}else{T.left=remaining();T.paused=true;}tick();}
function shiftTimer(d){if(!T.on)return;if(T.paused)T.left=Math.max(1,T.left+d);else T.end=Math.max(Date.now()+1000,T.end+d*1000);T.dur=Math.max(T.dur,remaining());tick();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&T.on)tick();});

render();
</script>
</body>
</html>
