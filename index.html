<style>

</style>

const pad=n=>String(n).padStart(2,'0');

const _sesCache={};
function buildSession(s){
 const t=dayType(s), d=day(s,false)||{};
 const ck=s+'|'+t+'|'+(d.outside?1:0)+'|'+(st.prof.curls||[]).join(',');
 if(_sesCache[ck]) return _sesCache[ck];
 let ses=null;
 if(t==='sq'||t==='dl') ses=liftSession(s,t);
 else if(t==='speed') ses=speedSession(s);
 else if(t==='jump') ses=jumpSession(s,!!d.outside);
 else if(t==='tissue') ses=tissueSession(s);
 else if(t==='min') ses=minSession();
 else return null;
 ses.reps={};
 ses.blocks.forEach((b,bi)=>{
  if(b.rounds) b.items=b.rounds.flatMap(r=>r.items);
  b.items.forEach(it=>{
   if(it.t==='c')it.id=bi+'|'+slug(b.title)+'|'+slug(it.label);
   if(it.t==='n')it.id='test|'+slug(it.label);
   if(it.t==='s')(ses.reps[it.ex]=ses.reps[it.ex]||[])[it.n-1]=it.target;
  });
 });
 _sesCache[ck]=ses;
 return ses;
}
function clearCache(){for(const k in _sesCache)delete _sesCache[k]}

/* ===== Floors ===== */
function sleepVal(s){const d=st.days[s];if(!d||!has(d.sleep))return null;const h=+d.sleep;return isNaN(h)?null:h}
function sleepOK(s){
 const h=sleepVal(s);if(h==null)return {ok:false,logged:false};
 if(h>=7)return {ok:true,logged:true,h};
 const mon=mondayOf(s);
 for(let i=0;i<7;i++){const x=addDays(mon,i);if(x>=s)break;const hx=sleepVal(x);if(hx!=null&&hx<7)return {ok:false,logged:true,h,used:true}}
 return {ok:true,logged:true,h,allowance:true};
}
function floorsOf(s){
 const d=st.days[s]||{},fl=d.fl||{};let n=0;
 FLOOR_KEYS.forEach(k=>{if(fl[k])n++});
 const sl=sleepOK(s);if(sl.ok)n++;
 const tot=FLOOR_KEYS.length+1;
 return {n,tot,win:n===tot,sl,miss:FLOOR_KEYS.filter(k=>!fl[k]).map(k=>FLOOR_NAME[k]).concat(sl.ok?[]:['Sleep 7 h'])};
}
function weekStats(mon){
 let wk=0,gym=0,snack=0,wins=0;const days=[];
 for(let i=0;i<7;i++){const s=addDays(mon,i),d=st.days[s]||{},t=dayType(s);
  if(workedOut(d))wk++;if(d.status==='Full'&&isLift(t))gym++;if(d.snackDone)snack++;
  const f=floorsOf(s);if(s>=FLOOR_START&&f.win)wins++;days.push({s,d,t,f})}
 return {wk,gym,snack,wins,days,floor:wk>=4&&gym>=2,goal:wk>=5&&gym>=2};
}

/* ===== History lookups (last time + next-time weight rule) ===== */
function lastFor(ex,reps,before){
 const key=reps?reps.join(','):null;
 const dates=Object.keys(st.days).filter(x=>x<before).sort().reverse();
 for(const dt of dates){const d=st.days[dt];const a=d.sets&&d.sets[ex];if(!a||!a.some(x=>x&&x.done))continue;if(key&&((d.reps&&d.reps[ex])||[]).join(',')!==key)continue;return {date:dt,sets:a,reps:(d.reps&&d.reps[ex])||[]}}
 return null;
}
const RULE=['Squat','Deadlift','Bench press','Hip thrust'];
function evaluate(ex,arr,reps){
 if(!arr||!arr.some(x=>x&&x.done)) return null;
 let drop=false,all=true;
 reps.forEach((t,i)=>{const x=arr[i];if(!x||!x.done||x.r===''){all=false;return}const r=+x.r;if(typeof t!=='number'){return}if(t===21&&r<15)drop=true;if(t<21&&r<=t-2)drop=true;if(r<t)all=false;});
 const rule=RULE.includes(ex);
 const per=reps.map((t,i)=>{const x=arr[i];if(!x||x.w===''||x.w==null)return '';const w=+x.w;if(!rule)return w;return drop?round5(w*0.9):all?w+5:w});
 const kind=rule?(drop?'drop':all?'add':'same'):'last';
 const txt={drop:'Too heavy: drop about 10% next time.',add:'Every rep hit: add 5 to 10 lb next time.',same:'Keep the same weights next time.',last:''}[kind];
 return {kind,per,txt};
}
const setsStr=a=>(a||[]).filter(x=>x&&x.done).map(x=>(x.w===''||x.w==null?'BW':x.w)+'x'+x.r).join(', ');
const repsOnlyStr=a=>(a||[]).filter(x=>x&&x.done).map(x=>x.r).join(', ');
function weekWeight(ex,wk){const dates=Object.keys(st.days).filter(d=>weekOf(d)===wk&&d>=START).sort();for(const d of dates){const a=(st.days[d].sets||{})[ex];if(a&&a[0]&&a[0].done&&a[0].w!=='')return +a[0].w}return null}
function exInfo(s,ex,reps){
 const w=weekOf(s), bw=latestBW();
 let hint='',ph=reps.map(()=>''),last=null,nxt=null;
 if(ex==='Squat retest'||ex==='Bench retest'){const sq=ex==='Squat retest';const v=weekWeight(sq?'Squat':'Bench press',sq?1:3);hint=(sq?'Week 1':'Week 3')+' starting weight'+(v?': '+v+' lb':' (not logged)')+'. Max reps.';if(v)ph=[v];return {hint,ph,last,nxt}}
 if(w===12&&(ex==='Squat'||ex==='Deadlift'||ex==='Bench press')){last=lastFor(ex,null,s);if(last){ph=reps.map((r,i)=>last.sets[i]&&last.sets[i].w!==''?last.sets[i].w:'');hint='Same weights as week 11.'}return {hint,ph,last,nxt}}
 last=lastFor(ex,reps,s);
 if(last){nxt=evaluate(ex,last.sets,last.reps);if(nxt)ph=reps.map((r,i)=>has(nxt.per[i])?nxt.per[i]:'')}
 else {
  const any=lastFor(ex,null,s);
  if((ex==='Squat'||ex==='Deadlift')&&reps[0]===21&&!any){hint='Test weight: bodyweight + 30 lb'+(bw?' = '+round5(bw+30)+' lb':' (add your weight on the Progress tab)')+'. Go for 21.';if(bw)ph=reps.map(()=>round5(bw+30))}
  else if(ex==='Bench press'&&reps[0]===21&&!lastFor(ex,[21,21,21],s)){hint='Test week: half bodyweight + 25 lb'+(bw?' = '+round5(bw/2+25)+' lb, after 2 x 8 at '+round5(bw/2)+' lb':'')+'. Aim for 21 every set. Use a spotter.';if(bw)ph=reps.map(()=>round5(bw/2+25));if(any)last=any}
  else if(any){ph=reps.map((r,i)=>{const x=any.sets[i]||any.sets[any.sets.length-1];return x&&has(x.w)?x.w:''});if(RULE.includes(ex))hint='New rep scheme. Start from your last weights and beat them.';last=any}
 }
 return {hint,ph,last,nxt};
}

/* ===== Session progress ===== */
const counted=it=>it.t==='c'||it.t==='s'||it.t==='n';
function itemDone(d,it){if(it.t==='c')return !!(d.checks&&d.checks[it.id]);if(it.t==='s'){const a=d.sets&&d.sets[it.ex];return !!(a&&a[it.n-1]&&a[it.n-1].done)}if(it.t==='n')return !!(d.tests&&has(d.tests[it.label]));return true}
function progress(s){const ses=buildSession(s);if(!ses)return {done:0,total:0,sets:0,setsDone:0};const d=dget(s);let done=0,total=0,sets=0,setsDone=0;
 ses.blocks.forEach(b=>b.items.forEach(it=>{if(!counted(it))return;total++;const x=itemDone(d,it);if(x)done++;if(it.t==='s'){sets++;if(x)setsDone++}}));return {done,total,sets,setsDone}}

/* ===== Timer (clock-based so it stays right if the phone sleeps) ===== */
let T=null,actx=null,wake=null;
function beep(n){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<(n||2);i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const t0=actx.currentTime+i*0.3;g.gain.setValueAtTime(0.3,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+0.22);o.start(t0);o.stop(t0+0.24)}}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200,100,200])}catch(e){}}
async function startTimer(steps){
 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
 T={steps,i:0,dur:steps[0][1]*1000,end:Date.now()+steps[0][1]*1000,paused:false,left:0};
 try{if(navigator.wakeLock&&!wake)wake=await navigator.wakeLock.request('screen')}catch(e){}
 tick();
}
function stopTimer(){T=null;const el=document.getElementById('timer');if(el)el.hidden=true;try{wake&&wake.release();wake=null}catch(e){}}
function nextStep(){if(!T)return;T.i++;if(T.i>=T.steps.length){beep(3);stopTimer();return}beep(2);T.dur=T.steps[T.i][1]*1000;T.end=Date.now()+T.dur}
function tLeft(){return T?(T.paused?T.left:T.end-Date.now()):0}
function tick(){
 if(T){if(!T.paused&&tLeft()<=0)nextStep();
  if(T){const el=document.getElementById('timer');el.hidden=false;const left=tLeft();
   document.getElementById('tbig').textContent=mmss(left/1000);
   document.getElementById('tbar').style.width=Math.max(0,Math.min(100,left/T.dur*100))+'%';
   document.getElementById('tpause').textContent=T.paused?'Go':'Pause';
   const nx=T.steps[T.i+1];document.getElementById('tlab').innerHTML=esc(T.steps[T.i][0])+'<small>'+(nx?'Next: '+esc(nx[0])+' '+mmss(nx[1]):(T.steps.length>1?'Last one':''))+'</small>'}}
 const cb=document.getElementById('clk');if(cb){const d=st.days[view.date];if(d&&d.clock){const el=(Date.now()-d.clock)/1000;cb.textContent=mmss(el);const pl=document.getElementById('clkplan');if(pl)pl.textContent=planAt(el)}}
}
let curStarts=[];
function planAt(el){let cur=null;curStarts.forEach(x=>{if(x.start<=el)cur=x});return cur?'Plan says: '+cur.title+' ('+cur.clock+')':''}

function db(){return new Promise((res,rej)=>{if(_db)return res(_db);if(!window.indexedDB)return rej('none');const r=indexedDB.open('mm45_photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>{_db=r.result;res(_db)};r.onerror=()=>rej(r.error)})}

function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const m=900,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

 /* history */
 const dates=Object.keys(st.days).filter(s=>{const d=st.days[s];return d.status||d.snackDone||Object.values(d.sets||{}).some(a=>a&&a.some(x=>x&&x.done))||Object.keys(d.tests||{}).length||Object.values(d.fl||{}).some(Boolean)}).sort().reverse();
 h+='<div class="block"><div class="ch"><h2>History</h2><span class="tag">'+dates.length+' days</span></div>';
 if(!dates.length)h+='<div class="small">Nothing logged yet. Your first trial run is Wed Oct 21.</div>';
 dates.slice(0,60).forEach(s=>{const d=st.days[s],f=floorsOf(s);h+='<div class="hist" data-act="goto" data-d="'+s+'"><b>'+esc(fmt(s))+'</b> '+(s>=FLOOR_START&&f.win?'<span class="badge">WIN</span>':'<span class="small">'+f.n+'/'+f.tot+' floors</span>')+'<div class="small">'+esc(typeName(s))+' &middot; '+(d.status?(d.status==='Minimum'?'Minimum day':'Full workout'):'workout not marked done')+(d.snackDone?' &middot; Tendon snack':'')+'</div>';
  Object.keys(d.sets||{}).forEach(ex=>{const t=setsStr(d.sets[ex]);if(t)h+='<div class="small"><b>'+esc(ex)+':</b> '+esc(t)+'</div>'});
  Object.keys(d.tests||{}).forEach(k=>{if(d.tests[k])h+='<div class="small"><b>'+esc(k)+':</b> '+esc(d.tests[k])+'</div>'});
  if(d.notes)h+='<div class="small">'+esc(d.notes)+'</div>';h+='</div>'});
 h+='</div>';
 /* settings */
 h+='<div class="block"><div class="ch"><h2>My super-set moves</h2></div><div class="note">Abs and shoulder press rotate every 2 weeks on their own. Pick your 3 curl moves:</div>'+[0,1,2].map(i=>'<select data-curl="'+i+'" style="margin:4px 0">'+CURL_OPTS.map(o=>'<option'+(st.prof.curls[i]===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>').join('')+'</div>';
 /* data */
 h+='<div class="block"><div class="ch"><h2>Backup</h2></div><div class="note">Everything saves on this phone. On Fridays, tap Copy backup and paste it in chat so your check-ins can see it.</div>';
 h+='<button class="btn full red" data-act="copyjson">Copy backup</button><div style="height:8px"></div><button class="btn full" data-act="exjson">Export backup (JSON)</button><div style="height:8px"></div><button class="btn full" data-act="excsv">Export sets (CSV)</button><div style="height:8px"></div><button class="btn full" data-act="exfl">Export floors (CSV)</button><div style="height:8px"></div><label class="btn full" style="display:flex;align-items:center;justify-content:center">Import backup (JSON)<input type="file" id="imp" accept=".json,application/json" class="hide"></label><div class="small" style="margin-top:6px">Import replaces what is on this phone. Older Mass Mafia 45 backups work too. Photos are not in the backup.</div>'+(st.migratedFrom?'<div class="small" style="margin-top:6px">Your data from the first version of this app was carried over.</div>':'')+'</div>';
 return h;
}
function sparkline(vals,small){const W=small?70:300,H=small?26:50;const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;const pts=vals.map((v,i)=>(i/(vals.length-1||1)*(W-4)+2).toFixed(1)+','+(H-2-(v-mn)/r*(H-4)).toFixed(1)).join(' ');return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="'+(small?'flex:none':'width:100%;margin:4px 0')+'"><polyline points="'+pts+'" fill="none" stroke="#e8323c" stroke-width="2"/></svg>'}

/* ===== Export / import ===== */
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const csv=rows=>rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\n');
function csvSets(){const rows=[['Date','Week','Day','Exercise','Set #','Target reps','Weight (lb)','Reps done','Notes']];Object.keys(st.days).sort().forEach(s=>{const d=st.days[s];Object.keys(d.sets||{}).forEach(ex=>(d.sets[ex]||[]).forEach((x,i)=>{if(x&&(x.done||has(x.w)||has(x.r)))rows.push([s,weekOf(s)===0?'Trial':weekOf(s),DOW[dowOf(s)],ex,i+1,((d.reps||{})[ex]||[])[i],x.w,x.r,[typeName(s),x.done?'':'not done',d.notes||''].filter(Boolean).join('. ')])}))});return csv(rows)}
function csvFloors(){const rows=[['Date','Day','WIN','Floors hit','Of',...FLOOR_KEYS.map(k=>FLOOR_NAME[k]),'Sleep hours','Workout','Session','Tendon snack','Water','Notes']];
 Object.keys(st.days).filter(s=>s>=FLOOR_START).sort().forEach(s=>{const d=st.days[s],f=floorsOf(s),fl=d.fl||{};rows.push([s,DOW[dowOf(s)],f.win?'yes':'no',f.n,f.tot,...FLOOR_KEYS.map(k=>fl[k]?'yes':''),has(d.sleep)?d.sleep:'',d.status||'',typeName(s),d.snackDone?'yes':'',(d.bonus||{}).water||'',d.dnotes||''])});return csv(rows)}

/* ===== Events ===== */
function setFromRow(el,d,ex,n){d.sets[ex]=d.sets[ex]||[];const x=d.sets[ex][n-1]=d.sets[ex][n-1]||{w:'',r:''};const row=el.closest('.setrow,.mrow');const wi=row&&row.querySelector('[data-f=w]'),ri=row&&row.querySelector('[data-f=r]');if(wi)x.w=wi.value;if(ri)x.r=ri.value;return x}
document.addEventListener('click',e=>{
 const nb=e.target.closest('nav button');if(nb){view.tab=nb.dataset.tab;if(view.tab==='week')view.week=null;view.ci=null;window.scrollTo(0,0);render();return}
 const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,s=view.date;
 if(a==='typesel')return;
 if(e.target.closest('input,select,textarea')&&a!=='set')return;
 if(a==='day'){const n=+el.dataset.n;view.date=n===0?todayS():addDays(view.date,n);view.addSlot=null;window.scrollTo(0,0);render()}
 else if(a==='goto'){view.date=el.dataset.d;view.tab='today';window.scrollTo(0,0);render()}
 else if(a==='tab'){view.tab=el.dataset.tab;window.scrollTo(0,0);render()}
 else if(a==='opentrain'){e.stopPropagation();view.tab='train';view.scrollTo=el.dataset.blk||null;if(!view.scrollTo)window.scrollTo(0,0);render()}
 else if(a==='pick'){view.date=el.dataset.d;render()}
 else if(a==='wkpick'){const i=+el.dataset.w;const mon=i===0?mondayOf(TRIAL1):addDays(START,(i-1)*7);const off=(dowOf(view.date)+6)%7;let d=addDays(mon,off);if(i===0&&d<TRIAL1)d=TRIAL1;view.date=d;render()}
 else if(a==='fl'){const ds=el.dataset.d,d=day(ds);d.fl[el.dataset.k]=!d.fl[el.dataset.k];save();const was=floorsOf(ds).win;render();if(was&&d.fl[el.dataset.k])beep(2)}
 else if(a==='chk'){const d=day(s);d.checks[el.dataset.id]=!d.checks[el.dataset.id];save();render()}
 else if(a==='snk'){const d=day(s);d.snack[el.dataset.id]=!d.snack[el.dataset.id];const sp=snackPlan(s);if(sp.items.every(i=>d.snack[i.id]))d.snackDone=true;save();render()}
 else if(a==='snackdone'){const d=day(s);d.snackDone=el.dataset.v==='1';save();render()}
 else if(a==='snackday'){const d=day(el.dataset.d);d.snackDone=!d.snackDone;save();render()}
 else if(a==='timer'){startTimer(JSON.parse(el.dataset.tm))}
 else if(a==='tstop'){stopTimer()}
 else if(a==='tpause'){if(!T)return;if(T.paused){T.end=Date.now()+T.left;T.paused=false}else{T.left=T.end-Date.now();T.paused=true}tick()}
 else if(a==='tadj'){if(!T)return;const v=+el.dataset.v*1000;if(T.paused)T.left=Math.max(0,T.left+v);else T.end+=v;T.dur=Math.max(T.dur+v,1000);tick()}
 else if(a==='set'){const d=day(s),ex=el.dataset.ex,n=+el.dataset.n;const x=setFromRow(el,d,ex,n);
  if(!x.done){if(x.w===''&&el.dataset.ph!=='')x.w=el.dataset.ph;const tg=el.dataset.target;if(x.r===''&&/^\d+$/.test(tg))x.r=tg;x.done=true;const rv=el.dataset.rest;const rest=rv==='auto'?st.prof.autoRest:+rv;if(rest)startTimer([['Rest',rest]])}else x.done=false;
  const ses=buildSession(s);d.reps[ex]=((ses&&ses.reps[ex])||[]).slice();save();render()}
 else if(a==='finish'){const d=day(s);d.status=el.dataset.v||'';save();if(d.status)beep(3);render()}
 else if(a==='type'){const d=day(s);d.type=el.dataset.v;save();if(view.tab==='today')view.tab='train';window.scrollTo(0,0);render()}
 else if(a==='outside'){const d=day(s);d.outside=el.dataset.v==='1';save();render()}
 else if(a==='clock'){const d=day(s);d.clock=el.dataset.v==='1'?Date.now():null;save();render()}
 else if(a==='autorest'){st.prof.autoRest=+el.dataset.v;save();render()}
 else if(a==='wk'){const n=+el.dataset.n;view.week=n===0?null:addDays(view.week,n);if(n===0)view.date=todayS();render()}
 else if(a==='wkgo'){view.week=el.dataset.d;render()}
 else if(a==='cyc'){const ds=el.dataset.d,d=day(ds);d.status=({'':'Full',Full:'Minimum',Minimum:''})[d.status||''];save();render()}
 else if(a==='water'){const d=day(s),v=+el.dataset.v;d.bonus.water=d.bonus.water===v?v-1:v;d.bonus.open=true;save();render()}
 else if(a==='bonus'){const d=day(s);d.bonus[el.dataset.k]=!d.bonus[el.dataset.k];d.bonus.open=true;save();render()}
 else if(a==='addslot'){view.addSlot=view.addSlot===el.dataset.k?null:el.dataset.k;render()}
 else if(a==='addfood'){const name=document.getElementById('fname').value.trim();if(!name){alert('Type what you ate.');return}const cal=document.getElementById('fcal').value.trim();const d=day(s),k=el.dataset.k;(d.food[k]=d.food[k]||[]).push({name,cal});if(document.getElementById('fsave').checked)st.myMeals.push({name,cal});view.addSlot=null;save();render()}
 else if(a==='addmy'||a==='addex'||a==='addrec'){const d=day(s),k=el.dataset.k;let m;if(a==='addmy')m=st.myMeals[+el.dataset.i];else if(a==='addex')m=EXTRAS[+el.dataset.i];else m=RECIPES.find(r=>r.id===el.dataset.id);if(!m)return;(d.food[k]=d.food[k]||[]).push({name:m.name,cal:m.cal||''});if(m.fl)d.fl[m.fl]=true;view.addSlot=null;save();render()}
 else if(a==='delfood'){const d=day(s);(d.food[el.dataset.k]||[]).splice(+el.dataset.i,1);save();render()}
 else if(a==='delmy'){if(!confirm('Delete this saved meal?'))return;st.myMeals.splice(+el.dataset.i,1);save();render()}
 else if(a==='addmeas'){const bw=document.getElementById('mbw').value.trim();if(!bw||isNaN(+bw)){alert('Enter your body weight.');return}st.meas.push({id:Date.now(),date:document.getElementById('mdate').value||todayS(),bw,notes:document.getElementById('mnotes').value});save();render()}
 else if(a==='delmeas'){if(!confirm('Delete this weigh-in?'))return;const id=+el.dataset.id;st.meas=st.meas.filter(x=>x.id!==id);save();render()}
 else if(a==='ciopen'){view.ci=el.dataset.k;if(!st.checkins[view.ci]){st.checkins[view.ci]={date:todayS(),m:{}};save()}window.scrollTo(0,0);render()}
 else if(a==='ciclose'){view.ci=null;render()}
 else if(a==='pose'){view.pose=el.dataset.v;render()}
 else if(a==='exjson'){st.lastExport=new Date().toISOString();save();updPill();download('mass-mafia-backup-'+todayS()+'.json',JSON.stringify(st,null,1),'application/json')}
 else if(a==='excsv'){download('mass-mafia-sets-'+todayS()+'.csv',csvSets(),'text/csv')}
 else if(a==='exfl'){download('mass-mafia-floors-'+todayS()+'.csv',csvFloors(),'text/csv')}
 else if(a==='copyjson'){st.lastExport=new Date().toISOString();save();updPill();const t=JSON.stringify(st);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Backup copied. Paste it in chat.')).catch(()=>prompt('Copy this backup:',t))}
});
document.addEventListener('change',e=>{
 const el=e.target;const s=view.date;
 if(el.dataset.act==='typesel'){const v=el.value;if(!v)return;const d=day(s);if(v==='reset')delete d.type;else d.type=v;save();window.scrollTo(0,0);render();return}
 if(el.dataset.f){const d=day(s),ex=el.dataset.ex,n=+el.dataset.n;d.sets[ex]=d.sets[ex]||[];const x=d.sets[ex][n-1]=d.sets[ex][n-1]||{w:'',r:''};x[el.dataset.f]=el.value;const ses=buildSession(s);d.reps[ex]=((ses&&ses.reps[ex])||[]).slice();save();return}
 if(el.dataset.test){const d=day(s);d.tests[el.dataset.test]=el.value;save();return}
 if(el.dataset.sleep){const d=day(el.dataset.sleep);d.sleep=el.value.trim();save();render();return}
 if(el.dataset.notes){const d=day(s);d.notes=el.value;save();return}
 if(el.dataset.dnotes){const d=day(s);d.dnotes=el.value;save();return}
 if(el.dataset.goal){st.prof.goals[el.dataset.goal]=el.value;save();return}
 if(el.dataset.curl){st.prof.curls[+el.dataset.curl]=el.value;save();clearCache();render();return}
 if(el.dataset.ci){const c=st.checkins[el.dataset.ci]=st.checkins[el.dataset.ci]||{m:{}};c.m=c.m||{};if(el.dataset.cf)c[el.dataset.cf]=el.value;if(el.dataset.cm)c.m[el.dataset.cm]=el.value;save();return}
 if(el.dataset.photoin&&el.files[0]){const k=el.dataset.photoin;shrink(el.files[0]).then(u=>photoPut(k,u)).then(()=>render()).catch(()=>alert('Could not save that photo on this phone.'));return}
 if(el.id==='imp'&&el.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||typeof j.days!=='object')throw 0;if(!confirm('Replace the data on this phone with this backup?'))return;st=j;norm();clearCache();save();alert('Backup loaded.');render()}catch(x){alert('That file is not a Mass Mafia backup.')}};r.readAsText(el.files[0])}
});
setInterval(tick,250);
load();render();
</script>
